<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="A .gui file in the editor, and the preview of the window the cursor is in beside it">
  <!-- The editor with the .gui file. -->
  <rect fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-panel-border, #444)" x="20" y="30" width="200" height="240" rx="6"/>
  <text fill="var(--vscode-descriptionForeground, #999)" font-size="12" font-family="var(--vscode-font-family, sans-serif)" x="34" y="50">interface/my_window.gui</text>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="34" y="66" width="120" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="46" y="82" width="140" height="6" rx="3"/>
  <rect fill="var(--vscode-editor-lineHighlightBorder, #f5922a)" opacity=".35" x="24" y="94" width="192" height="18"/>
  <rect fill="#f5922a" x="58" y="100" width="96" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="58" y="118" width="130" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="58" y="134" width="88" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="58" y="150" width="112" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="58" y="166" width="70" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="46" y="182" width="40" height="6" rx="3"/>
  <rect fill="var(--vscode-foreground, #ccc)" opacity=".45" x="34" y="198" width="20" height="6" rx="3"/>
  <!-- The preview beside it. -->
  <rect fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-panel-border, #444)" x="240" y="30" width="220" height="240" rx="6"/>
  <text fill="var(--vscode-descriptionForeground, #999)" font-size="12" font-family="var(--vscode-font-family, sans-serif)" x="254" y="50">Preview my_window</text>
  <rect fill="var(--vscode-editorWidget-background, #252526)" stroke="#f5922a" stroke-width="2" x="262" y="70" width="176" height="176" rx="4"/>
  <rect x="262" y="70" width="176" height="28" rx="4" fill="#f5922a" opacity=".25"/>
  <rect x="300" y="80" width="100" height="8" rx="4" fill="var(--vscode-foreground, #ccc)" opacity=".7"/>
  <rect x="276" y="112" width="48" height="48" rx="3" fill="var(--vscode-foreground, #ccc)" opacity=".2"/>
  <rect x="334" y="114" width="90" height="6" rx="3" fill="var(--vscode-foreground, #ccc)" opacity=".5"/>
  <rect x="334" y="128" width="78" height="6" rx="3" fill="var(--vscode-foreground, #ccc)" opacity=".5"/>
  <rect x="334" y="142" width="84" height="6" rx="3" fill="var(--vscode-foreground, #ccc)" opacity=".5"/>
  <rect x="276" y="178" width="148" height="22" rx="3" fill="var(--vscode-button-background, #0e639c)" opacity=".8"/>
  <rect x="276" y="210" width="148" height="22" rx="3" fill="var(--vscode-button-background, #0e639c)" opacity=".5"/>
  <!-- The cursor's window is the one the preview draws. -->
  <path d="M206 103 C 230 103, 236 90, 256 86" stroke="#f5922a" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path fill="#f5922a" d="m256 86-9-4 3 9z"/>
</svg>
