<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="A game folder found through Steam, holding eu4.exe">
  <rect fill="var(--vscode-editor-background, #1e1e1e)" stroke="var(--vscode-panel-border, #444)" x="40" y="40" width="400" height="220" rx="8"/>
  <!-- Steam's library list leads to the game folder. -->
  <text fill="var(--vscode-descriptionForeground, #999)" font-size="13" font-family="var(--vscode-font-family, sans-serif)" x="64" y="74">Steam library</text>
  <path stroke="var(--vscode-panel-border, #444)" stroke-width="1.5" fill="none" d="M76 86v40h28"/>
  <path fill="#f5922a" d="M108 112h22l6 7h32v34h-60z" opacity=".9"/>
  <text fill="var(--vscode-foreground, #ccc)" font-size="15" font-family="var(--vscode-font-family, sans-serif)" x="180" y="140">Europa Universalis IV</text>
  <path stroke="var(--vscode-panel-border, #444)" stroke-width="1.5" fill="none" d="M128 160v58h28M128 190h28"/>
  <rect x="160" y="180" width="18" height="20" rx="2" fill="var(--vscode-foreground, #ccc)" opacity=".55"/>
  <text fill="var(--vscode-foreground, #ccc)" font-size="15" font-family="var(--vscode-font-family, sans-serif)" x="190" y="196">eu4.exe</text>
  <text fill="var(--vscode-descriptionForeground, #999)" font-size="13" font-family="var(--vscode-font-family, sans-serif)" x="270" y="196">1.37.5</text>
  <rect x="160" y="210" width="18" height="20" rx="2" fill="var(--vscode-foreground, #ccc)" opacity=".3"/>
  <text fill="var(--vscode-descriptionForeground, #999)" font-size="13" font-family="var(--vscode-font-family, sans-serif)" x="190" y="226">gfx · interface · localisation</text>
  <!-- Found. -->
  <circle fill="#f5922a" cx="396" cy="134" r="18"/>
  <path d="m387 134 6 6 12-12" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
