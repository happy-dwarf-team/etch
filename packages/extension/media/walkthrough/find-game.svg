<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="A game folder found through Steam, holding eu4.exe">
  <style>
    .panel { fill: var(--vscode-editor-background, #1e1e1e); stroke: var(--vscode-panel-border, #444); }
    .text { fill: var(--vscode-foreground, #ccc); font: 15px var(--vscode-font-family, sans-serif); }
    .muted { fill: var(--vscode-descriptionForeground, #999); font: 13px var(--vscode-font-family, sans-serif); }
    .accent { fill: #f5922a; }
    .line { stroke: var(--vscode-panel-border, #444); stroke-width: 1.5; fill: none; }
  </style>
  <rect class="panel" x="40" y="40" width="400" height="220" rx="8"/>
  <!-- Steam's library list leads to the game folder. -->
  <text class="muted" x="64" y="74">Steam library</text>
  <path class="line" d="M76 86v40h28"/>
  <path class="accent" d="M108 112h22l6 7h32v34h-60z" opacity=".9"/>
  <text class="text" x="180" y="140">Europa Universalis IV</text>
  <path class="line" d="M128 160v58h28M128 190h28"/>
  <rect x="160" y="180" width="18" height="20" rx="2" fill="var(--vscode-foreground, #ccc)" opacity=".55"/>
  <text class="text" x="190" y="196">eu4.exe</text>
  <text class="muted" x="270" y="196">1.37.5</text>
  <rect x="160" y="210" width="18" height="20" rx="2" fill="var(--vscode-foreground, #ccc)" opacity=".3"/>
  <text class="muted" x="190" y="226">gfx · interface · localisation</text>
  <!-- Found. -->
  <circle class="accent" cx="396" cy="134" r="18"/>
  <path d="m387 134 6 6 12-12" stroke="var(--vscode-editor-background, #1e1e1e)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
