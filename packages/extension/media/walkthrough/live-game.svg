<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Saving a file in the editor reloads it in the live game; pick mode goes back from a widget in the game to its line">
  <style>
    .panel { fill: var(--vscode-editor-background, #1e1e1e); stroke: var(--vscode-panel-border, #444); }
    .game { fill: var(--vscode-editorWidget-background, #252526); stroke: var(--vscode-panel-border, #555); }
    .code { fill: var(--vscode-foreground, #ccc); opacity: .45; }
    .text { fill: var(--vscode-foreground, #ccc); font: 13px var(--vscode-font-family, sans-serif); }
    .muted { fill: var(--vscode-descriptionForeground, #999); font: 12px var(--vscode-font-family, sans-serif); }
    .accent { fill: #f5922a; }
    .arrow { stroke: #f5922a; stroke-width: 2; fill: none; }
  </style>
  <!-- The editor. -->
  <rect class="panel" x="20" y="40" width="170" height="220" rx="6"/>
  <text class="muted" x="34" y="62">my_window.gui</text>
  <rect class="code" x="34" y="78" width="100" height="6" rx="3"/>
  <rect class="code" x="46" y="94" width="120" height="6" rx="3"/>
  <rect x="24" y="106" width="162" height="18" fill="#f5922a" opacity=".2"/>
  <rect class="accent" x="46" y="112" width="96" height="6" rx="3"/>
  <rect class="code" x="46" y="130" width="110" height="6" rx="3"/>
  <rect class="code" x="46" y="146" width="80" height="6" rx="3"/>
  <rect class="code" x="34" y="162" width="20" height="6" rx="3"/>
  <!-- EU4, the live game. -->
  <rect class="game" x="250" y="40" width="210" height="220" rx="6"/>
  <text class="muted" x="264" y="62">EU4 · the live game</text>
  <rect x="270" y="78" width="170" height="160" rx="3" fill="var(--vscode-foreground, #ccc)" opacity=".08"/>
  <rect x="290" y="104" width="130" height="30" rx="3" fill="none" stroke="#f5922a" stroke-width="2"/>
  <rect x="304" y="115" width="100" height="8" rx="4" fill="var(--vscode-foreground, #ccc)" opacity=".6"/>
  <rect x="290" y="150" width="130" height="60" rx="3" fill="var(--vscode-foreground, #ccc)" opacity=".15"/>
  <!-- The pointer in pick mode. -->
  <path class="accent" d="m398 124 0 22 5-6 5 10 4-2-5-10 8 0z"/>
  <!-- Save goes in; a pick comes back. -->
  <path class="arrow" d="M190 96 C 214 90, 226 90, 248 98"/>
  <path class="accent" d="m250 99-9-5 1 9z"/>
  <text class="text" x="196" y="82">Ctrl+S</text>
  <path class="arrow" d="M250 190 C 226 200, 214 200, 192 190" stroke-dasharray="4 4"/>
  <path class="accent" d="m190 189 9-4-1 9z"/>
  <text class="text" x="200" y="222">pick</text>
</svg>
