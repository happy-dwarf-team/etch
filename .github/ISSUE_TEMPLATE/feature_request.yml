name: Feature request
description: A new capability for mod authors in the preview, the outline or the diagnostics.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [what v2 contains](https://github.com/happy-dwarf-team/etch/blob/main/docs/spec/v2.md) and [what comes after it](https://github.com/happy-dwarf-team/etch/blob/main/docs/spec/after-v2.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
