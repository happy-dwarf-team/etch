name: build

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml to build the VSIX of a new release.
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from packageManager in package.json. No store cache:
      # on Windows runners the store and the checkout are on different drives,
      # so pnpm does not use a cached store anyway.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Renderer tests
        run: |
          pnpm --filter @etch/renderer exec playwright install --only-shell chromium
          pnpm test:renderer

      # Downloads the current stable VS Code and runs the suite in it.
      - name: Extension tests
        run: pnpm test:extension

      - name: Package
        run: pnpm package

      # Per-commit artifact; for a release, release.yml attaches the VSIX to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etch-${{ github.sha }}
          path: packages/extension/dist/*.vsix
          if-no-files-found: error
