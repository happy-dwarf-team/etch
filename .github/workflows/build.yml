name: build

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml to build the VSIX of a new release.
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from packageManager in package.json. No store cache:
      # on Windows runners the store and the checkout are on different drives,
      # so pnpm does not use a cached store anyway.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      # The headless Chromium the renderer and compare tests run in, cached per Playwright
      # version: its download host has failed runs before (ENOTFOUND), and a hit skips it.
      - name: Playwright version
        id: playwright
        shell: pwsh
        run: |
          $version = (pnpm --filter @etch/renderer exec playwright --version).Split(' ')[-1]
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @etch/renderer exec playwright install --only-shell chromium

      - name: Renderer tests
        run: pnpm test:renderer

      # Downloads the current stable VS Code and runs the suite in it.
      - name: Extension tests
        run: pnpm test:extension

      # Etch's Anvil plugin (plugin/): the CMake build with /W4 /WX against the
      # Anvil SDK pinned in plugin/CMakeLists.txt, and its tests.
      - name: Plugin build
        run: |
          cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64
          cmake --build plugin/build --config Release

      - name: Plugin tests
        run: ctest --test-dir plugin/build -C Release --output-on-failure

      # plugin.toml and symbols.toml against Anvil's schemas, and
      # plugin/symbols.lock against symbols.toml (the lock comes from
      # `anvil check plugin --exe` on the real eu4.exe), as annotations.
      - name: anvil check
        shell: pwsh
        run: |
          $anvil = (Get-Content plugin/build/anvil-tool.txt -Raw).Trim()
          & $anvil --version
          & $anvil check plugin --format github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # One clang-format version for everyone (CONTRIBUTING.md).
      - name: Plugin format
        shell: pwsh
        run: |
          $files = git ls-files 'plugin/*.cpp' 'plugin/*.hpp'
          pipx run --spec clang-format==21.1.8 clang-format --dry-run --Werror @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The plugin folder that packaging takes whole for anvil/plugins/etch/ (pins/README.md).
      - name: Plugin install
        run: cmake --install plugin/build --config Release --component plugin --prefix plugin/dist

      # The pin and notices checks (pins/README.md): downloads Anvil and Bellows at
      # their pinned hashes, checks their licences and writes THIRD-PARTY-NOTICES.md.
      - name: Pins and notices
        run: pnpm pins

      - name: Package
        run: pnpm package

      # Per-commit artifact; for a release, release.yml attaches the VSIX to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etch-${{ github.sha }}
          path: packages/extension/dist/*.vsix
          if-no-files-found: error
