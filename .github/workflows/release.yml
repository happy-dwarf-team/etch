name: release

# release-please keeps a "chore(main): release x.y.z" pull request up to date
# from the Conventional Commits on main (package.json versions + CHANGELOG.md).
# Merging it tags vX.Y.Z and creates the GitHub release; the jobs below then
# build that commit, attach the win32-x64 VSIX and publish the same file to the
# VS Code Marketplace and Open VSX (ADR 0004). Each store job can be re-run on
# its own: an already published version is skipped.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token the release PR does not trigger CI (GitHub does not
      # start workflows from GITHUB_TOKEN events). A RELEASE_PLEASE_TOKEN secret
      # (fine-grained token or GitHub App token) makes the checks run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etch-${{ github.sha }}
          path: dist

      # The VSIX is named after the version in packages/extension/package.json,
      # which release-please bumped together with the tag.
      - name: Prepare release assets
        working-directory: dist
        run: |
          vsix="etch-win32-x64-${TAG#v}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "::error::expected $vsix for $TAG, found: $(ls)"
            exit 1
          fi
          sha256sum "$vsix" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      # Signed build provenance: `gh attestation verify etch-win32-x64-X.Y.Z.vsix -R happy-dwarf-team/etch`.
      # GitHub offers attestations to public repositories on every plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.VSIX }}

      - name: Upload release assets
        working-directory: dist
        run: gh release upload "$TAG" "$VSIX" SHA256SUMS.txt --clobber

  # Publishes with the VSCE_PAT secret when it is set. The Marketplace offers
  # no trusted publishing (OIDC) yet, and a token needs an Azure DevOps
  # organization, so until then the job leaves a warning with the VSIX to
  # upload by hand (docs/release.md).
  marketplace:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # vsce at the version in pnpm-lock.yaml.
      - name: Install
        run: pnpm install --frozen-lockfile --filter etch

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etch-${{ github.sha }}
          path: release

      - name: Publish to the VS Code Marketplace
        env:
          MARKETPLACE_TOKEN: ${{ secrets.VSCE_PAT }}
        run: |
          vsix="etch-win32-x64-${TAG#v}.vsix"
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$vsix"
            manage="https://marketplace.visualstudio.com/manage/publishers/happy-dwarf-team"
            echo "::warning title=Upload to the Marketplace by hand::VSCE_PAT is not set. Upload $url at $manage (docs/release.md)."
            {
              echo "### VS Code Marketplace: upload by hand"
              echo
              echo "VSCE_PAT is not set, so this job did not publish. Download [$vsix]($url)"
              echo "and upload it at <$manage> (docs/release.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export VSCE_PAT="$MARKETPLACE_TOKEN"
          pnpm --filter etch exec vsce publish --packagePath "$GITHUB_WORKSPACE/release/$vsix" --skip-duplicate

  # Open VSX trusted publishing (OIDC) works only for an extension that already
  # has a version, so the first release needs the OVSX_PAT secret. Once the
  # trusted publisher for release.yml is registered and the secret is deleted,
  # releases publish without a token (docs/release.md).
  open-vsx:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # ovsx at the version in pnpm-lock.yaml.
      - name: Install
        run: pnpm install --frozen-lockfile --filter etch

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etch-${{ github.sha }}
          path: release

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="$GITHUB_WORKSPACE/release/etch-win32-x64-${TAG#v}.vsix"
          if [ -n "$OPEN_VSX_TOKEN" ]; then
            OVSX_PAT="$OPEN_VSX_TOKEN" pnpm --filter etch exec ovsx publish "$vsix" --skip-duplicate
          else
            pnpm --filter etch exec ovsx publish "$vsix" --trusted-publishing --skip-duplicate
          fi
