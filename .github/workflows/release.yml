name: release

# release-please keeps a "chore(main): release x.y.z" pull request up to date
# from the Conventional Commits on main (package.json versions + CHANGELOG.md).
# Merging it tags vX.Y.Z and creates the GitHub release; the jobs below then
# build that commit and attach the win32-x64 VSIX. Store publishing comes with
# the 0.1.0 release (milestone M1).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token the release PR does not trigger CI (GitHub does not
      # start workflows from GITHUB_TOKEN events). A RELEASE_PLEASE_TOKEN secret
      # (fine-grained token or GitHub App token) makes the checks run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etch-${{ github.sha }}
          path: dist

      # The VSIX is named after the version in packages/extension/package.json,
      # which release-please bumped together with the tag.
      - name: Prepare release assets
        working-directory: dist
        run: |
          vsix="etch-win32-x64-${TAG#v}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "::error::expected $vsix for $TAG, found: $(ls)"
            exit 1
          fi
          sha256sum "$vsix" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      # Signed build provenance: `gh attestation verify etch-win32-x64-X.Y.Z.vsix -R happy-dwarf-team/etch`.
      # GitHub offers attestations to public repositories on every plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.VSIX }}

      - name: Upload release assets
        working-directory: dist
        run: gh release upload "$TAG" "$VSIX" SHA256SUMS.txt --clobber
