name: release

# release-please keeps a "chore(main): release x.y.z" pull request up to date
# from the Conventional Commits on main (package.json versions + CHANGELOG.md).
# Merging it tags vX.Y.Z and creates the GitHub release; the jobs below then
# build that commit, attach the win32-x64 VSIX and publish the same file to the
# VS Code Marketplace and Open VSX (ADR 0004). Each store job can be re-run on
# its own: an already published version is skipped.
#
# The build checks out the release's tag, not the commit that started the run:
# release-please can create the release from a later commit than github.sha when
# two pushes come close together (2.3.0 was built from the commit before it).
# Run by hand (workflow_dispatch) with an existing tag, it builds that tag again
# and publishes it to the release and the stores; nothing is tagged.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to build and publish again, e.g. v2.3.0
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # On this job and not on the workflow: a release's `marketplace` job waits for a maintainer's
    # approval, and a group over the whole run would hold every later push behind it, so no
    # release pull request would appear until the approval (2.5.1 held 2.5.2 back).
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token the release PR does not trigger CI (GitHub does not
      # start workflows from GITHUB_TOKEN events). A RELEASE_PLEASE_TOKEN secret
      # (fine-grained token or GitHub App token) makes the checks run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etch-${{ inputs.tag || needs.release-please.outputs.tag_name }}
          path: dist

      # The VSIX is named after the version in packages/extension/package.json,
      # which release-please bumped together with the tag.
      - name: Prepare release assets
        working-directory: dist
        run: |
          vsix="etch-win32-x64-${TAG#v}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "::error::expected $vsix for $TAG, found: $(ls)"
            exit 1
          fi
          sha256sum "$vsix" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      # Signed build provenance: `gh attestation verify etch-win32-x64-X.Y.Z.vsix -R happy-dwarf-team/etch`.
      # GitHub offers attestations to public repositories on every plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.VSIX }}

      - name: Upload release assets
        working-directory: dist
        run: gh release upload "$TAG" "$VSIX" SHA256SUMS.txt --clobber

  # Rebuilds etch.happydwarf.dev and happydwarf.dev once the VSIX is attached, so
  # their badges show the new version.
  notify-website:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/website.yml
    permissions: {}
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    secrets:
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}

  # Posts the release to the team's Discord server once it has its VSIX. A hand
  # run rebuilds an existing tag, so it posts nothing.
  notify-discord:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.event_name == 'push' }}
    uses: happy-dwarf-team/.github/.github/workflows/discord-release.yml@d5db96e09ee8035b0bb9aabfdd4f280cc1dbc45e # main
    permissions: {}
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

  # Trusted publishing (OIDC): the happy-dwarf-team publisher's policy names this
  # repository, release.yml and the vscode-marketplace environment, which needs a
  # maintainer's approval for each run. Without the policy a VSCE_PAT secret
  # publishes, and without either the job leaves a warning with the VSIX to upload
  # by hand (docs/release.md).
  marketplace:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # vsce at the version in pnpm-lock.yaml.
      - name: Install
        run: pnpm install --frozen-lockfile --filter etch

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etch-${{ inputs.tag || needs.release-please.outputs.tag_name }}
          path: release

      # `vsce publish --oidc` never falls back to a token by itself, so the step does: trusted
      # publishing first, then VSCE_PAT if set, then a warning with the VSIX to upload by hand.
      # The summary says which one published, so the token can be deleted once OIDC has.
      - name: Publish to the VS Code Marketplace
        env:
          MARKETPLACE_TOKEN: ${{ secrets.VSCE_PAT }}
        run: |
          vsix="etch-win32-x64-${TAG#v}.vsix"
          package="$GITHUB_WORKSPACE/release/$vsix"
          if pnpm --filter etch exec vsce publish --packagePath "$package" --oidc --skip-duplicate; then
            echo "### VS Code Marketplace: published with trusted publishing (OIDC)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$MARKETPLACE_TOKEN" ]; then
            echo "::warning title=Marketplace trusted publishing failed::Publishing with the VSCE_PAT secret instead (docs/release.md)."
            VSCE_PAT="$MARKETPLACE_TOKEN" pnpm --filter etch exec vsce publish --packagePath "$package" --skip-duplicate
            echo "### VS Code Marketplace: published with VSCE_PAT (trusted publishing failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$vsix"
          manage="https://marketplace.visualstudio.com/manage/publishers/happy-dwarf-team"
          echo "::warning title=Upload to the Marketplace by hand::Trusted publishing failed and VSCE_PAT is not set. Upload $url at $manage (docs/release.md)."
          {
            echo "### VS Code Marketplace: upload by hand"
            echo
            echo "Trusted publishing failed and VSCE_PAT is not set, so this job did not publish. Download [$vsix]($url)"
            echo "and upload it at <$manage> (docs/release.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Open VSX trusted publishing (OIDC), registered for release.yml by a namespace
  # owner. Until it is registered, or when it fails, the OVSX_PAT secret
  # publishes; once a release's summary shows OIDC published, the secret is
  # deleted (docs/release.md).
  open-vsx:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # ovsx at the version in pnpm-lock.yaml.
      - name: Install
        run: pnpm install --frozen-lockfile --filter etch

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etch-${{ inputs.tag || needs.release-please.outputs.tag_name }}
          path: release

      # Trusted publishing first; OVSX_PAT, if still set, only when it fails. The summary says
      # which one published, so the token can be deleted once OIDC has.
      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="$GITHUB_WORKSPACE/release/etch-win32-x64-${TAG#v}.vsix"
          if pnpm --filter etch exec ovsx publish "$vsix" --trusted-publishing --skip-duplicate; then
            echo "### Open VSX: published with trusted publishing (OIDC)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "::error title=Open VSX trusted publishing failed::OVSX_PAT is not set either (docs/release.md)."
            exit 1
          fi
          echo "::warning title=Open VSX trusted publishing failed::Publishing with the OVSX_PAT secret instead (docs/release.md)."
          OVSX_PAT="$OPEN_VSX_TOKEN" pnpm --filter etch exec ovsx publish "$vsix" --skip-duplicate
          echo "### Open VSX: published with OVSX_PAT (trusted publishing failed)" >> "$GITHUB_STEP_SUMMARY"
