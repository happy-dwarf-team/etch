id = "etch"
name = "Etch"
version = "2.9.0"          # release-please sets it with package.json in each release pull request
authors = ["Happy Dwarf Team"]
description = "The live game of Etch, the VS Code previewer for interface mods: reloads saved interface files into the game's own windows on Etch's request over a private pipe, picks a widget to open its definition (Ctrl+Shift+E), and runs a script the modder selected in Etch through the game's console. Idle unless Etch started the game."
api = 2
anvil = ">=1.5.2"
entry = "etch.dll"
# Main: Tongs, whose tongs.ui reads the widget tree, is a main-phase plugin,
# and an early plugin cannot depend on one. The pipe is up within a second.
phase = "main"
symbols = "symbols.toml"   # the game build comes from here
settings = "settings.toml" # the pick mode key
# Etch reloads interface files in its own private install. Run selection
# (lab#156) changes the game state of that private copy through the game's own
# console `run`, on the modder's command and never in ironman or multiplayer,
# where the plugin refuses it; the plugin hooks nothing in the simulation. True
# would make Anvil hold back pick mode and `confirm` in ironman and multiplayer
# too (lab#65).
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/etch/issues"
repository = "https://github.com/happy-dwarf-team/etch"

# Readiness (the main menu is up), the frame counter of a ping, the game
# session and main-thread work.
[[dependencies]]
id = "anvil-game"
version = "^1"

# tongs.ui version 1, the widget tree: the stale-window check after a reload,
# pick mode and live snapshots (from 0.22, each text with its colour codes);
# tongs.navigation version 1 (from 0.24): the province view selected again after
# a restart or a reload (H8). The private install pins Tongs and keeps it at
# enabled = false (no pipe). A caret on 0.x takes one minor version only, so
# this follows the pin in pins/game-builds.json; from 0.28 the widget
# rectangles are in window pixels at any GUI scale.
[[dependencies]]
id = "tongs"
version = "^0.33"
