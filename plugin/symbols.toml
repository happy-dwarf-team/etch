# Every game address the plugin uses, declared once. `anvil gen` turns it into
# symbols.gen.h and symbols.gen.hpp; Anvil verifies it against eu4.exe before
# loading the DLL and skips the plugin on any other build, so the game host runs
# only the pinned 1.37.5. After a change, run `anvil check plugin --exe <eu4.exe>`
# (or the etch-check target with EU4_EXE set) and commit symbols.lock.
build = "eu4-1.37.5-steam-win64"

# --- The game's console (preview jobs, etch#50). The same symbols as Tongs'
# game calls: the main menu has the console manager but no game session, so
# Etch calls the dispatcher itself (etch#21).

[symbol.console_dispatch]
rva = 0x1721320
sha256 = "E4CC13A880AE51124F30C516A9734F01F7920CCF073567696AE9AC3F6A2163BB"
size = 42
memory = "code"
signature = "void* (void* manager, void* result, void* tokens)"
note = "console dispatcher: (manager, result, tokens) -> result; runs one tokenised line"

[symbol.console_manager_get]
rva = 0x6E74C0
sha256 = "52E0D56F1825FCE1E7C929F8A42825ED5EEF5D52D094F74BCA761D2163B39650"
size = 16
memory = "code"
values.manager = { at = 7, rip_relative = 11, is = 0x2357B58 }
note = "console manager getter: the singleton pointer"

[symbol.string_free]
rva = 0x95660
sha256 = "DC903CD914BB214A13EFAE1C640150B1F9DD18B8ACB197868053E46D7DCBF224"
size = 22
memory = "code"
signature = "void (void* text)"
note = "the game's std::string destructor, to free the console's result text"

# --- Keys the live game presses for the player (H2, H7): SDL 2.0.4 is linked
# into eu4.exe with its dynamic API, every SDL_* call jumping through a table SDL
# fills when it starts. The same symbol as Tongs' input: the game takes Escape
# only from its SDL event queue, not from a posted key message.

[symbol.sdl_dynapi_init]
rva = 0x17325DD
sha256 = "13615524E71AA0878877FF206F0013A73B47BDCB2D9C5F4D67C978023CC4E5A1"
size = 14
memory = "code"
values.push_event = { at = 3, rip_relative = 7, is = 0x1746B90 }
values.push_event_slot = { at = 10, rip_relative = 14, is = 0x1FB02C0 }
note = "SDL 2.0.4 dynapi init: slot 88 = SDL_PushEvent"

# --- The game's tooltips, hidden in pick mode (docs/spec/after-v2.md, "Pick
# mode hides the game's tooltips"). The tooltip controller's update (0x1414EF0)
# runs once a frame and is the only caller of the show below; when the game
# shows no tooltip it calls the hide instead, which the plugin's hook does in
# pick mode.

[symbol.tooltip_show]
rva = 0x1415390
sha256 = "21E0A36167CA43077E91BFC1338B260E6E85DAF9CF355342779A6C0F613292EE"
size = 34
memory = "code"
signature = "void (void* controller, const void* point)"
note = "tooltip controller: shows the tooltip of the object (or the map) under the point"

[symbol.tooltip_hide]
rva = 0x1415340
sha256 = "40F31EA054956696DB74F42E70D66BBD88EB130ACF58EC1FDA0C57ADA1088E6D"
size = 27
memory = "code"
signature = "void (void* controller)"
note = "tooltip controller: hides the tooltip window and forgets the object it was for"
