# Every game address the plugin uses, declared once. `anvil gen` turns it into
# symbols.gen.h and symbols.gen.hpp; Anvil verifies it against eu4.exe before
# loading the DLL and skips the plugin on any other build, so the game host runs
# only the pinned 1.37.5. After a change, run `anvil check plugin --exe <eu4.exe>`
# (or the etch-check target with EU4_EXE set) and commit symbols.lock.
build = "eu4-1.37.5-steam-win64"

# --- The game's console (preview jobs, etch#50). The same symbols as Tongs'
# game calls: the main menu has the console manager but no game session, so
# Etch calls the dispatcher itself (etch#21).

[symbol.console_dispatch]
rva = 0x1721320
bytes = "48 89 5C 24 10 48 89 4C 24 08 55 56 57 41 54 41 55 41 56 41 57 48 8D 6C 24 D0 48 81 EC 30 01 00 00 49 8B F0 48 8B FA 4C 8B E1"
memory = "code"
signature = "void* (void* manager, void* result, void* tokens)"
note = "console dispatcher: (manager, result, tokens) -> result; runs one tokenised line"

[symbol.console_manager_get]
rva = 0x6E74C0
bytes = "48 83 EC 28 48 8B 05 8D 06 C7 01 48 85 C0 75 3D"
memory = "code"
values.manager = { at = 7, rip_relative = 11 }
note = "console manager getter: the singleton pointer"

[symbol.string_free]
rva = 0x95660
bytes = "40 53 48 83 EC 20 48 8B 51 18 48 8B D9 48 83 FA 10 72 2C 48 8B 09"
memory = "code"
signature = "void (void* text)"
note = "the game's std::string destructor, to free the console's result text"

# --- Keys the live game presses for the player (H2, H7): SDL 2.0.4 is linked
# into eu4.exe with its dynamic API, every SDL_* call jumping through a table SDL
# fills when it starts. The same symbol as Tongs' input: the game takes Escape
# only from its SDL event queue, not from a posted key message.

[symbol.sdl_dynapi_init]
rva = 0x17325DD
bytes = "48 8D 0D AC 45 01 00 48 89 0D D5 DC 87 00"
memory = "code"
values.push_event = { at = 3, rip_relative = 7 }
values.push_event_slot = { at = 10, rip_relative = 14 }
note = "SDL 2.0.4 dynapi init: slot 88 = SDL_PushEvent"
